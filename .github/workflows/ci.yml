name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages/shared
        run: pnpm --filter @ipskill/shared typecheck

      - name: Typecheck apps/mobile
        run: pnpm --filter @ipskill/mobile typecheck

      - name: Build apps/web
        run: pnpm --filter @ipskill/web build
